<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Atendimento</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='4' fill='%232257d6'/%3E%3Cpath d='M9 13h14M9 19h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
	--bg: #f4f5f7;
	--surface: #ffffff;
	--surface-2: #eef0f3;
	--text: #1a1e23;
	--muted: #5c6571;
	--border: #d8dde3;
	--accent: #2257d6;
	--aberto: #b45309;
	--andamento: #2257d6;
	--fechado: #15803d;
	--erro: #c62828;
	--estrela: #e0a100;
	--sombra: 0 1px 2px rgb(0 0 0 / 0.05), 0 4px 14px rgb(0 0 0 / 0.04);
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #101317;
		--surface: #181c22;
		--surface-2: #222830;
		--text: #e6e9ed;
		--muted: #9aa3ae;
		--border: #2e353f;
		--accent: #7aa2ff;
		--aberto: #f0b46b;
		--andamento: #86a8ff;
		--fechado: #4ac27a;
		--erro: #ff6b6b;
		--estrela: #f5c542;
		--sombra: 0 1px 2px rgb(0 0 0 / 0.4);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #101317;
	--surface: #181c22;
	--surface-2: #222830;
	--text: #e6e9ed;
	--muted: #9aa3ae;
	--border: #2e353f;
	--accent: #7aa2ff;
	--aberto: #f0b46b;
	--andamento: #86a8ff;
	--fechado: #4ac27a;
	--erro: #ff6b6b;
	--estrela: #f5c542;
	--sombra: 0 1px 2px rgb(0 0 0 / 0.4);
	color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 16px; }
body {
	margin: 0; background: var(--bg); color: var(--text);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
	line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }

.topo {
	position: sticky; top: 0; z-index: 5;
	display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
	padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: var(--text); text-decoration: none; }
.eu { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); }
.eu select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-weight: 600; }
.link-aula { font-size: 0.88rem; color: var(--accent); text-decoration: none; font-weight: 600; }

.app { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 1280px; margin: 0 auto; }
.painel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--sombra); min-width: 0; }

.lista-topo { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--border); }
.abas { display: flex; gap: 4px; }
.abas button {
	border: 0; background: none; padding: 7px 12px; border-radius: 8px; cursor: pointer;
	font-weight: 600; font-size: 0.9rem; color: var(--muted); display: flex; align-items: center; gap: 6px;
}
.abas button:hover { background: var(--surface-2); }
.abas button.ativo { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.abas .qtd { font-size: 0.75rem; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 0 7px; }
.abas button.ativo .qtd { background: var(--accent); color: #fff; }

.botao {
	border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
	background: var(--accent); color: #fff; font-weight: 600; font-size: 0.9rem; white-space: nowrap;
}
.botao:hover { filter: brightness(1.08); }
.botao:disabled { opacity: 0.6; cursor: wait; }
.botao.sec { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.botao.ok { background: var(--fechado); }
#novo { margin-left: auto; }

.tickets { list-style: none; margin: 0; padding: 6px; max-height: calc(100vh - 150px); overflow-y: auto; }
.item {
	width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
	padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 4px;
}
.item:hover { background: var(--surface-2); }
.item.ativo { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.item .linha1 { display: flex; align-items: baseline; gap: 8px; }
.item .id { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.item .titulo { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .linha2 { display: flex; gap: 6px; font-size: 0.82rem; color: var(--muted); flex-wrap: wrap; }
.item .quando { margin-left: auto; }
.vazio { color: var(--muted); text-align: center; padding: 40px 16px; font-size: 0.92rem; }

.selo { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid; }
.selo.ABERTO { color: var(--aberto); }
.selo.EM_ANDAMENTO { color: var(--andamento); }
.selo.FECHADO { color: var(--fechado); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

.detalhe { padding: 24px; display: flex; flex-direction: column; gap: 20px; align-self: start; }
.detalhe .cab { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem; }
.detalhe h1 { font-size: 1.5rem; margin: 4px 0 0; line-height: 1.25; }
.detalhe .meta { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.cartoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cartao { border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.cartao .rot, .bloco > .rot { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.cartao .nome { font-weight: 600; }
.cartao .sub { color: var(--muted); font-size: 0.85rem; }
.na-fila { color: var(--aberto); font-weight: 600; }

.estrelas { color: var(--estrela); font-size: 1.3rem; letter-spacing: 2px; }
.estrelas .apagada { color: var(--border); }
.escolha-nota { display: flex; gap: 4px; }
.escolha-nota button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 1.1rem; color: var(--border); }
.escolha-nota button.on { color: var(--estrela); border-color: var(--estrela); }

form { display: flex; flex-direction: column; gap: 14px; }
.campo { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.campo input, .campo select, .campo textarea {
	padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-weight: 400; color: var(--text);
}
.campo textarea { min-height: 70px; resize: vertical; }
.opcoes-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.opcoes-tags label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; cursor: pointer; color: var(--text); font-weight: 400; }
.opcoes-tags input { margin: 0; }

.aviso {
	position: fixed; right: 20px; bottom: 20px; max-width: min(420px, calc(100vw - 40px));
	padding: 12px 16px; border-radius: 10px; background: var(--text); color: var(--bg);
	box-shadow: var(--sombra); font-size: 0.92rem; opacity: 0; transform: translateY(8px);
	transition: opacity 0.2s, transform 0.2s; pointer-events: none;
}
.aviso.mostrar { opacity: 1; transform: none; }
.aviso.erro { background: var(--erro); color: #fff; }

@media (max-width: 820px) {
	.app { grid-template-columns: minmax(0, 1fr); padding: 12px; }
	.tickets { max-height: 45vh; }
	.cartoes { grid-template-columns: minmax(0, 1fr); }
	.eu { margin-left: 0; }
}
</style>
</head>
<body>
<header class="topo">
	<a class="marca" href="./">
		<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="4" fill="#2257d6"/><path d="M9 13h14M9 19h9" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
		Mini Atendimento
	</a>
	<label class="eu">Você é <select id="eu" aria-label="Atendente logado"></select></label>
	<a class="link-aula" href="/">Modo aula →</a>
</header>

<main class="app">
	<section class="painel">
		<div class="lista-topo">
			<nav class="abas" id="abas" aria-label="Filtrar tickets"></nav>
			<button id="novo" class="botao">+ Novo</button>
		</div>
		<ul id="tickets" class="tickets"></ul>
	</section>
	<section id="detalhe" class="painel detalhe" aria-live="polite"></section>
</main>
<div id="aviso" class="aviso" role="status"></div>

<script>
'use strict';

const estado = {
	tickets: [],
	clientes: [],
	atendentes: [],
	tags: [],
	eu: null,
	aba: 'fila',
	aberto: null,
	criando: false,
};

const ABAS = {
	fila: { rotulo: 'Fila', filtro: (t) => !t.atendenteId && t.status !== 'FECHADO', vazio: 'Nenhum ticket esperando atendimento.' },
	meus: { rotulo: 'Meus', filtro: (t) => t.atendenteId === estado.eu && t.status !== 'FECHADO', vazio: 'Você não tem tickets em andamento.' },
	todos: { rotulo: 'Todos', filtro: () => true, vazio: 'Nenhum ticket ainda.' },
};

const STATUS = { ABERTO: 'Aberto', EM_ANDAMENTO: 'Em andamento', FECHADO: 'Fechado' };

/* ---------- utilitarios ---------- */
function el(tag, props, ...filhos) {
	const no = document.createElement(tag);
	for (const [chave, valor] of Object.entries(props || {})) {
		if (valor == null || valor === false) continue;
		if (chave === 'class') no.className = valor;
		else if (chave.startsWith('on')) no.addEventListener(chave.slice(2), valor);
		else no.setAttribute(chave, valor === true ? '' : valor);
	}
	for (const filho of filhos.flat(Infinity)) {
		if (filho == null || filho === false) continue;
		no.append(filho instanceof Node ? filho : String(filho));
	}
	return no;
}

async function api(caminho, metodo = 'GET', corpo) {
	const resposta = await fetch(`/api${caminho}`, {
		method: metodo,
		headers: corpo ? { 'content-type': 'application/json' } : {},
		body: corpo ? JSON.stringify(corpo) : undefined,
	});
	const json = await resposta.json().catch(() => ({}));
	if (!resposta.ok) throw new Error([].concat(json.message || json.motivo || `Erro ${resposta.status}`).join(', '));
	return json.data;
}

function tempo(iso) {
	const minutos = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
	if (minutos < 1) return 'agora';
	if (minutos < 60) return `há ${minutos} min`;
	const horas = Math.round(minutos / 60);
	if (horas < 24) return `há ${horas} h`;
	const dias = Math.round(horas / 24);
	return dias === 1 ? 'há 1 dia' : `há ${dias} dias`;
}

let timerAviso;
function aviso(mensagem, tipo = '') {
	const caixa = document.getElementById('aviso');
	caixa.textContent = mensagem;
	caixa.className = `aviso mostrar ${tipo}`;
	clearTimeout(timerAviso);
	timerAviso = setTimeout(() => (caixa.className = 'aviso'), 3500);
}

function guardar(chave, valor) {
	try {
		localStorage.setItem(chave, valor);
	} catch {}
}

function ler(chave) {
	try {
		return localStorage.getItem(chave);
	} catch {
		return null;
	}
}

const selo = (status) => el('span', { class: `selo ${status}` }, STATUS[status]);
const chips = (tags) => (tags.length ? el('div', { class: 'chips' }, tags.map((t) => el('span', { class: 'chip' }, t.tag.nome))) : null);
const estrelas = (nota) => el('span', { class: 'estrelas', 'aria-label': `nota ${nota} de 5` }, '★'.repeat(nota), el('span', { class: 'apagada' }, '★'.repeat(5 - nota)));

/* ---------- dados ---------- */
async function carregar() {
	estado.tickets = await api('/tickets');
	desenhar();
}

async function executar(promessa, mensagem) {
	try {
		const ticket = await promessa;
		await carregar();
		if (ticket?.id) abrir(ticket.id);
		aviso(mensagem);
	} catch (erro) {
		aviso(erro.message, 'erro');
	}
}

/* ---------- desenho ---------- */
function desenhar() {
	desenharAbas();
	desenharLista();
	desenharDetalhe();
}

function desenharAbas() {
	document.getElementById('abas').replaceChildren(
		...Object.entries(ABAS).map(([chave, aba]) =>
			el(
				'button',
				{ class: chave === estado.aba ? 'ativo' : null, onclick: () => ((estado.aba = chave), desenhar()) },
				aba.rotulo,
				el('span', { class: 'qtd' }, estado.tickets.filter(aba.filtro).length),
			),
		),
	);
}

function desenharLista() {
	const aba = ABAS[estado.aba];
	const visiveis = estado.tickets.filter(aba.filtro);
	const lista = document.getElementById('tickets');
	if (!visiveis.length) return lista.replaceChildren(el('li', { class: 'vazio' }, aba.vazio));
	lista.replaceChildren(
		...visiveis.map((t) =>
			el(
				'li',
				{},
				el(
					'button',
					{ class: `item${t.id === estado.aberto && !estado.criando ? ' ativo' : ''}`, onclick: () => abrir(t.id) },
					el('div', { class: 'linha1' }, el('span', { class: 'id' }, `#${t.id}`), el('span', { class: 'titulo' }, t.titulo), selo(t.status)),
					el('div', { class: 'linha2' }, t.cliente.nome, ' · ', t.atendente ? t.atendente.nome : el('span', { class: 'na-fila' }, 'na fila'), el('span', { class: 'quando' }, tempo(t.criadoEm))),
					chips(t.tags),
				),
			),
		),
	);
}

function abrir(id) {
	estado.aberto = id;
	estado.criando = false;
	desenharLista();
	desenharDetalhe();
	if (matchMedia('(max-width: 820px)').matches) document.getElementById('detalhe').scrollIntoView({ behavior: 'smooth' });
}

function desenharDetalhe() {
	const painel = document.getElementById('detalhe');
	if (estado.criando) return painel.replaceChildren(...formularioNovo());
	const t = estado.tickets.find((x) => x.id === estado.aberto);
	if (!t) return painel.replaceChildren(el('p', { class: 'vazio' }, 'Escolha um ticket na lista ou abra um novo.'));

	const meu = t.atendenteId === estado.eu;
	const acoes = [];
	if (t.status !== 'FECHADO') {
		if (!meu) {
			acoes.push(
				el('button', { class: 'botao', onclick: () => executar(api(`/tickets/${t.id}/assumir`, 'PATCH', { atendenteId: estado.eu }), 'Ticket assumido') }, t.atendenteId ? 'Transferir para mim' : 'Assumir ticket'),
			);
		} else {
			acoes.push(el('button', { class: 'botao ok', onclick: () => executar(api(`/tickets/${t.id}/fechar`, 'PATCH'), 'Ticket fechado') }, 'Fechar ticket'));
		}
		if (t.atendenteId) {
			acoes.push(el('button', { class: 'botao sec', onclick: () => executar(api(`/tickets/${t.id}/devolver`, 'PATCH'), 'Ticket devolvido para a fila') }, 'Devolver para a fila'));
		}
	}

	const outrosDoCliente = estado.tickets.filter((x) => x.clienteId === t.clienteId).length;

	const partes = [
		el(
			'div',
			{},
			el('div', { class: 'cab' }, `#${t.id}`, selo(t.status)),
			el('h1', {}, t.titulo),
			el('p', { class: 'meta' }, `Aberto ${tempo(t.criadoEm)} por ${t.cliente.nome}`),
		),
		acoes.length ? el('div', { class: 'acoes' }, acoes) : null,
		el(
			'div',
			{ class: 'cartoes' },
			el('div', { class: 'cartao' }, el('div', { class: 'rot' }, 'Cliente'), el('div', { class: 'nome' }, t.cliente.nome), el('div', { class: 'sub' }, t.cliente.email), el('div', { class: 'sub' }, `${outrosDoCliente} ${outrosDoCliente === 1 ? 'ticket' : 'tickets'} no total`)),
			el(
				'div',
				{ class: 'cartao' },
				el('div', { class: 'rot' }, 'Atendente'),
				t.atendente ? [el('div', { class: 'nome' }, t.atendente.nome), el('div', { class: 'sub' }, t.atendente.email)] : el('div', { class: 'na-fila' }, 'Ninguém ainda: está na fila'),
			),
		),
		el('div', { class: 'bloco' }, el('div', { class: 'rot' }, 'Tags'), chips(t.tags) || el('span', { class: 'sub' }, 'Sem tags')),
		t.status === 'FECHADO' ? blocoAvaliacao(t) : null,
	];
	// replaceChildren escreveria "null" na tela: so entram os blocos que existem.
	painel.replaceChildren(...partes.filter(Boolean));
}

function blocoAvaliacao(t) {
	if (t.avaliacao) {
		return el(
			'div',
			{ class: 'bloco' },
			el('div', { class: 'rot' }, 'Avaliação do cliente'),
			estrelas(t.avaliacao.nota),
			t.avaliacao.comentario && el('p', { class: 'meta' }, `“${t.avaliacao.comentario}”`),
		);
	}

	let nota = 0;
	const botoes = [1, 2, 3, 4, 5].map((n) =>
		el(
			'button',
			{
				type: 'button',
				'aria-label': `nota ${n}`,
				onclick: () => {
					nota = n;
					botoes.forEach((b, i) => b.classList.toggle('on', i < n));
				},
			},
			'★',
		),
	);
	const comentario = el('textarea', { placeholder: 'O que o cliente disse? (opcional)' });

	return el(
		'form',
		{
			class: 'bloco',
			onsubmit: (ev) => {
				ev.preventDefault();
				if (!nota) return aviso('Escolha uma nota de 1 a 5', 'erro');
				executar(api(`/tickets/${t.id}/avaliacao`, 'POST', { nota, comentario: comentario.value }), 'Avaliação registrada');
			},
		},
		el('div', { class: 'rot' }, 'Registrar avaliação do cliente'),
		el('div', { class: 'escolha-nota' }, botoes),
		el('label', { class: 'campo' }, comentario),
		el('div', {}, el('button', { class: 'botao' }, 'Registrar avaliação')),
	);
}

function formularioNovo() {
	const cliente = el('select', { required: true }, el('option', { value: '' }, 'Escolha o cliente'), estado.clientes.map((c) => el('option', { value: c.id }, `${c.nome} (${c.email})`)));
	const titulo = el('input', { required: true, maxlength: 120, placeholder: 'Ex.: Não consigo emitir a nota fiscal' });
	const tags = estado.tags.map((tag) => el('input', { type: 'checkbox', value: tag.id }));

	return [
		el('h1', {}, 'Novo ticket'),
		el(
			'form',
			{
				onsubmit: (ev) => {
					ev.preventDefault();
					estado.aba = 'fila';
					executar(
						api('/tickets', 'POST', {
							titulo: titulo.value,
							clienteId: Number(cliente.value),
							tagIds: tags.filter((t) => t.checked).map((t) => Number(t.value)),
						}),
						'Ticket aberto: está na fila',
					);
				},
			},
			el('label', { class: 'campo' }, 'Cliente', cliente),
			el('label', { class: 'campo' }, 'Título', titulo),
			el('div', { class: 'campo' }, 'Tags', el('div', { class: 'opcoes-tags' }, estado.tags.map((tag, i) => el('label', {}, tags[i], tag.nome)))),
			el(
				'div',
				{ class: 'acoes' },
				el('button', { class: 'botao' }, 'Abrir ticket'),
				el('button', { type: 'button', class: 'botao sec', onclick: () => ((estado.criando = false), desenhar()) }, 'Cancelar'),
			),
		),
	];
}

/* ---------- inicio ---------- */
async function iniciar() {
	const tema = ler('tema');
	if (tema) document.documentElement.dataset.theme = tema;

	try {
		const cadastros = await api('/cadastros');
		Object.assign(estado, cadastros);
	} catch (erro) {
		document.getElementById('detalhe').replaceChildren(el('p', { class: 'vazio' }, `Não consegui falar com o backend: ${erro.message}`));
		return;
	}

	// So atendentes ativos podem trabalhar (a mesma regra que o backend confere).
	const ativos = estado.atendentes.filter((a) => a.ativo);
	const salvo = Number(ler('atendente'));
	estado.eu = ativos.some((a) => a.id === salvo) ? salvo : ativos[0]?.id ?? null;

	const seletor = document.getElementById('eu');
	seletor.replaceChildren(...ativos.map((a) => el('option', { value: a.id, selected: a.id === estado.eu }, a.nome)));
	seletor.addEventListener('change', () => {
		estado.eu = Number(seletor.value);
		guardar('atendente', estado.eu);
		desenhar();
	});

	document.getElementById('novo').addEventListener('click', () => {
		estado.criando = true;
		desenhar();
	});

	await carregar();

	// Atualiza sozinho para quem estiver com a tela aberta ver o que os outros fazem,
	// mas nunca no meio de algo sendo digitado.
	setInterval(() => {
		if (!estado.criando && !document.activeElement?.closest('input, textarea, select, form')) carregar().catch(() => {});
	}, 15000);
}

iniciar();
</script>
</body>
</html>
