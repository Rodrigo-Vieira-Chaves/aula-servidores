<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 11h19l-5-5M27 21H8l5 5' fill='none' stroke='%232257d6' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
	--bg: #f4f5f7;
	--surface: #ffffff;
	--surface-2: #eef0f3;
	--text: #1a1e23;
	--muted: #5c6571;
	--border: #d8dde3;
	--accent: #2257d6;
	--http: #e0782a;
	--ws: #0e8a7e;
	--vazio: #9aa3ae;
	--sobe: #15803d;
	--desce: #c62828;
	--f-fin: #2f6fdf;
	--f-rsv: #6b7280;
	--f-op: #8a4fd6;
	--f-mask: #c2367a;
	--f-len: #c27c0e;
	--f-chave: #0e7490;
	--f-dados: #15803d;
	--ok: #15803d;
	--erro: #c62828;
	--code-bg: #f5f6f9;
	--hl-k: #1d4ed8;
	--hl-j: #a21caf;
	--hl-s: #b45309;
	--hl-c: #6b7280;
	--hl-a: #0e7490;
	--hl-n: #15803d;
	--sombra: 0 1px 2px rgb(0 0 0 / 0.05), 0 4px 14px rgb(0 0 0 / 0.04);
	--raio: 10px;
	--mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #101317;
		--surface: #181c22;
		--surface-2: #222830;
		--text: #e6e9ed;
		--muted: #9aa3ae;
		--border: #2e353f;
		--accent: #7aa2ff;
		--http: #f0954f;
		--ws: #2fc2b1;
		--vazio: #5c6571;
		--sobe: #4ac27a;
		--desce: #ff6b6b;
		--f-fin: #5b91f2;
		--f-rsv: #9aa3ae;
		--f-op: #ad84f2;
		--f-mask: #ec6aa6;
		--f-len: #e8a63a;
		--f-chave: #5fd0e0;
		--f-dados: #4ac27a;
		--ok: #4ac27a;
		--erro: #ff6b6b;
		--code-bg: #13171c;
		--hl-k: #86a8ff;
		--hl-j: #e38bf0;
		--hl-s: #f0b46b;
		--hl-c: #7d8794;
		--hl-a: #5fd0e0;
		--hl-n: #6fd69a;
		--sombra: 0 1px 2px rgb(0 0 0 / 0.4);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #101317;
	--surface: #181c22;
	--surface-2: #222830;
	--text: #e6e9ed;
	--muted: #9aa3ae;
	--border: #2e353f;
	--accent: #7aa2ff;
	--http: #f0954f;
	--ws: #2fc2b1;
	--vazio: #5c6571;
	--sobe: #4ac27a;
	--desce: #ff6b6b;
	--f-fin: #5b91f2;
	--f-rsv: #9aa3ae;
	--f-op: #ad84f2;
	--f-mask: #ec6aa6;
	--f-len: #e8a63a;
	--f-chave: #5fd0e0;
	--f-dados: #4ac27a;
	--ok: #4ac27a;
	--erro: #ff6b6b;
	--code-bg: #13171c;
	--hl-k: #86a8ff;
	--hl-j: #e38bf0;
	--hl-s: #f0b46b;
	--hl-c: #7d8794;
	--hl-a: #5fd0e0;
	--hl-n: #6fd69a;
	--sombra: 0 1px 2px rgb(0 0 0 / 0.4);
	color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 17px; }
body {
	margin: 0;
	background: var(--bg);
	color: var(--text);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
code, pre { font-family: var(--mono); }
code { font-size: 0.9em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
h1, h2, h3 { line-height: 1.2; margin: 0; }

/* ---------- topo e layout ---------- */
.topo {
	position: sticky; top: 0; z-index: 10;
	display: flex; align-items: center; gap: 14px;
	padding: 10px 20px;
	background: var(--surface);
	border-bottom: 1px solid var(--border);
}
.marca { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.marca strong { font-size: 1.05rem; }
.marca span { color: var(--muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-dir { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.saude {
	display: inline-flex; align-items: center; gap: 8px;
	font-size: 0.78rem; color: var(--muted);
	padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
	white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw;
}
.saude::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.saude.ok::before { background: var(--ok); }
.saude.falha { color: var(--erro); border-color: var(--erro); }
.saude.falha::before { background: var(--erro); }
.link-sistema {
	font-size: 0.85rem; font-weight: 600; text-decoration: none; white-space: nowrap;
	padding: 5px 12px; border-radius: 8px; background: var(--accent); color: #fff;
}
.link-sistema:hover { filter: brightness(1.08); }
.icone {
	border: 1px solid var(--border); background: var(--surface); color: var(--text);
	width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1rem; flex: none;
}
.icone:hover { background: var(--surface-2); }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 57px); }
body.sem-menu .layout { grid-template-columns: minmax(0, 1fr); }
body.sem-menu .menu { display: none; }

.menu {
	border-right: 1px solid var(--border);
	background: var(--surface);
	padding: 18px 12px 40px;
	position: sticky; top: 57px; align-self: start;
	height: calc(100vh - 57px); overflow-y: auto;
}
.menu h4 { margin: 18px 10px 6px; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.menu h4:first-child { margin-top: 0; }
.menu a {
	display: flex; align-items: center; gap: 10px;
	padding: 7px 10px; border-radius: 8px;
	color: var(--text); text-decoration: none; font-size: 0.92rem;
}
.menu a:hover { background: var(--surface-2); }
.menu a.ativo { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
.menu .num { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); width: 1.6em; text-align: right; flex: none; }
.menu a.ativo .num { color: inherit; }

.conteudo { padding: 28px 36px 40px; min-width: 0; }
.pagina { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }

/* ---------- blocos de pagina ---------- */
.pag-cab .eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pag-cab h1 { font-size: 2.1rem; margin-top: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.pag-cab h1 .sub { font-size: 1.1rem; font-weight: 500; color: var(--muted); }
.pag-cab .lead { font-size: 1.12rem; margin: 10px 0 0; max-width: 75ch; }

.secao { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.secao > h2 { font-size: 1.2rem; }
.secao > .ajuda { margin: -6px 0 0; color: var(--muted); font-size: 0.92rem; }

.cartao {
	background: var(--surface); border: 1px solid var(--border); border-radius: var(--raio);
	padding: 18px 20px; box-shadow: var(--sombra); min-width: 0;
	display: flex; flex-direction: column; gap: 12px;
}
.cartao > h3 { font-size: 1rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cartao > h3 .qtd { font-weight: 400; font-size: 0.85rem; color: var(--muted); }
.cartao > p { margin: 0; }
.cartao .rodape-cartao { margin: 0; color: var(--muted); font-size: 0.88rem; }

.grade-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grade-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }

.pergunta {
	border-left: 4px solid var(--accent);
	background: color-mix(in srgb, var(--accent) 8%, var(--surface));
	padding: 14px 18px; border-radius: 0 var(--raio) var(--raio) 0;
}
.pergunta .rot { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.pergunta p { margin: 4px 0 0; font-size: 1.15rem; font-weight: 600; }

.nota { border-radius: var(--raio); padding: 14px 18px; border: 1px solid var(--border); background: var(--surface); min-width: 0; }
.nota .rot { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.nota ul, .nota ol { margin: 6px 0 0; padding-left: 1.2em; }
.nota li + li { margin-top: 4px; }
.nota p { margin: 6px 0 0; }
.nota.repare { border-color: color-mix(in srgb, var(--f-op) 45%, var(--border)); }
.nota.repare .rot { color: var(--f-op); }
.nota.dica { border-color: color-mix(in srgb, var(--f-len) 45%, var(--border)); }
.nota.dica .rot { color: var(--f-len); }
.nota .codigo { margin-top: 10px; }

/* ---------- codigo ---------- */
.codigo { margin: 0; min-width: 0; }
.codigo figcaption { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.codigo pre {
	margin: 0; padding: 14px 16px; background: var(--code-bg);
	border: 1px solid var(--border); border-radius: 8px;
	font-size: 0.86rem; line-height: 1.55; overflow-x: auto; white-space: pre;
}
.hl-k { color: var(--hl-k); font-weight: 600; }
.hl-j { color: var(--hl-j); font-weight: 700; }
.hl-s { color: var(--hl-s); }
.hl-c { color: var(--hl-c); font-style: italic; }
.hl-a { color: var(--hl-a); }
.hl-n { color: var(--hl-n); }
.hl-jk { color: var(--hl-a); }

.tabela-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { background: var(--surface-2); font-size: 0.78rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
td.mono, .mono { font-family: var(--mono); font-size: 0.84rem; }
td.nowrap { white-space: nowrap; }

.botao {
	background: var(--accent); color: #fff; border: 0; border-radius: 8px;
	padding: 8px 16px; font-weight: 600; font-size: 0.9rem; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.botao:hover { filter: brightness(1.08); }
.botao:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.botao.sec { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.botao.sec.ativo { background: var(--accent); color: #fff; border-color: var(--accent); }
.botao.perigo { background: var(--erro); }
.botoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.entrada {
	padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
	min-width: 0; flex: 1;
}
.entrada.curta { flex: 0 1 150px; }
.linha-form { display: flex; gap: 8px; flex-wrap: wrap; }

.alternar { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.alternar button { border: 0; background: var(--surface); color: var(--text); padding: 7px 14px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
.alternar button + button { border-left: 1px solid var(--border); }
.alternar button.ativo { background: var(--accent); color: #fff; }

/* ---------- diagrama de sequencia ---------- */
.seq { width: 100%; height: auto; display: block; max-width: 420px; margin: 0 auto; }
.seq-ator { fill: var(--surface-2); stroke: var(--border); }
.seq-ator-txt { font: 600 13px system-ui, sans-serif; fill: var(--text); }
.seq-vida { stroke: var(--border); stroke-width: 2; stroke-dasharray: 4 4; }
.seq-faixa { fill: color-mix(in srgb, var(--ws) 10%, transparent); stroke: color-mix(in srgb, var(--ws) 40%, transparent); stroke-dasharray: 3 3; }
.seq-faixa-txt { font: 700 10px var(--mono); fill: var(--ws); letter-spacing: 0.04em; }
.seq-seta { stroke-width: 2.2; }
.seq-texto { font: 600 13px var(--mono); }
.seq-nota { font: italic 12px system-ui, sans-serif; fill: var(--muted); }
.seq .http { stroke: var(--http); fill: var(--http); }
.seq .vazio { stroke: var(--vazio); fill: var(--vazio); }
.seq .ws { stroke: var(--ws); fill: var(--ws); }
.seq text.http, .seq text.vazio, .seq text.ws { stroke: none; }
.seq line.vazio { stroke-dasharray: 5 4; }

/* ---------- polling x websocket ---------- */
.contadores { display: flex; gap: 10px; flex-wrap: wrap; }
.contador { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-width: 96px; }
.contador b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.contador span { font-size: 0.75rem; color: var(--muted); }
.contador.ruim b { color: var(--vazio); }
.contador.bom b { color: var(--ok); }
.faixa-req { display: flex; flex-wrap: wrap; gap: 3px; min-height: 14px; }
.faixa-req i { width: 10px; height: 14px; border-radius: 2px; background: var(--vazio); opacity: 0.55; }
.faixa-req i.novidade { background: var(--ok); opacity: 1; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
.feed li { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 0.9rem; display: flex; gap: 8px; align-items: baseline; }
.feed li .autor { font-weight: 700; }
.feed li .atraso { margin-left: auto; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.feed li .atraso.lento { color: var(--http); font-weight: 700; }
.feed li .atraso.rapido { color: var(--ws); font-weight: 700; }
.feed .vazio-feed { color: var(--muted); font-style: italic; border-style: dashed; }
.cartao.lado-http { border-top: 4px solid var(--http); }
.cartao.lado-ws { border-top: 4px solid var(--ws); }

/* ---------- handshake ---------- */
.http-msg pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.http-msg .linha1 { color: var(--http); font-weight: 700; }
.http-msg .nome-cab { color: var(--muted); }
.http-msg .chave-ws { background: color-mix(in srgb, var(--ws) 16%, transparent); border-radius: 3px; }
.http-msg .chave-ws .nome-cab { color: var(--ws); font-weight: 700; }
.conta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; align-items: baseline; margin: 0; }
.conta dt { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.conta dd { margin: 0; font-family: var(--mono); font-size: 0.86rem; overflow-wrap: anywhere; }
.conta .guid { color: var(--f-op); font-weight: 700; }
.conta .chave { color: var(--f-chave); font-weight: 700; }
.conta .accept { color: var(--ok); font-weight: 700; }
.veredito { border-radius: 8px; padding: 10px 14px; font-weight: 700; }
.veredito.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
.veredito.erro { background: color-mix(in srgb, var(--erro) 12%, transparent); color: var(--erro); }

/* ---------- frame ---------- */
.bytes { display: flex; flex-wrap: wrap; gap: 4px; }
.byte { font: 600 0.95rem var(--mono); padding: 6px 7px; border-radius: 6px; color: #fff; min-width: 2.6em; text-align: center; }
.byte.c-b0 { background: var(--f-op); }
.byte.c-b1 { background: var(--f-len); }
.byte.c-ext { background: color-mix(in srgb, var(--f-len) 70%, #000); }
.byte.c-chave { background: var(--f-chave); }
.byte.c-dados { background: var(--f-dados); }
.byte.c-mais { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--border); }
.legenda-bytes { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); }
.legenda-bytes span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-bytes i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.bits { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
.bit { text-align: center; border-radius: 5px; padding: 4px 0 2px; color: #fff; }
.bit b { display: block; font: 700 1.1rem var(--mono); }
.bit small { display: block; font-size: 0.62rem; opacity: 0.9; letter-spacing: 0.02em; }
.bit.fin { background: var(--f-fin); }
.bit.rsv { background: var(--f-rsv); }
.bit.op { background: var(--f-op); }
.bit.mask { background: var(--f-mask); }
.bit.len { background: var(--f-len); }
.leitura { margin: 6px 0 0; font-size: 0.9rem; }
.leitura b { font-family: var(--mono); }
.xor { font-family: var(--mono); font-size: 0.82rem; }
.xor th { font-family: system-ui, sans-serif; }
.xor td { text-align: center; padding: 5px 6px; }
.xor td:first-child, .xor th:first-child { text-align: left; white-space: nowrap; }
.xor .r-dado td { color: var(--f-dados); font-weight: 700; }
.xor .r-chave td { color: var(--f-chave); }
.xor .r-fio td { color: var(--f-mask); font-weight: 700; }
.xor .r-dado td:first-child, .xor .r-chave td:first-child, .xor .r-fio td:first-child { color: var(--text); font-weight: 600; font-family: system-ui, sans-serif; }
.totais { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- api / laboratorio ---------- */
.estados { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.estado { border: 2px solid var(--border); border-radius: 8px; padding: 6px 12px; text-align: center; font: 700 0.82rem var(--mono); color: var(--muted); transition: all 0.15s; }
.estado small { display: block; font-size: 0.68rem; font-weight: 400; }
.estado.on { border-color: var(--ws); color: var(--ws); background: color-mix(in srgb, var(--ws) 12%, transparent); }
.estados .seta { color: var(--muted); }
.log { list-style: none; margin: 0; padding: 8px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; font: 0.82rem var(--mono); max-height: 300px; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.log li { display: grid; grid-template-columns: 6.2em 7.5em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.log .hora { color: var(--muted); }
.log .tipo { font-weight: 700; }
.log .txt { overflow-wrap: anywhere; }
.log .t-open .tipo, .log .t-info .tipo { color: var(--ws); }
.log .t-env .tipo { color: var(--sobe); }
.log .t-rec .tipo { color: var(--desce); }
.log .t-close .tipo, .log .t-error .tipo { color: var(--f-len); }
.log .vazio-log { color: var(--muted); font-style: italic; display: block; }

/* ---------- devtools ---------- */
.passos { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
.passos li::marker { font-weight: 700; color: var(--accent); }
kbd { font: 600 0.82em var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); }
.seta-env { color: var(--sobe); font-weight: 700; }
.seta-rec { color: var(--desce); font-weight: 700; }

/* ---------- sistemas ---------- */
.endereco { font: 700 1.6rem var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.dir { font: 700 0.75rem var(--mono); padding: 1px 7px; border-radius: 999px; color: #fff; white-space: nowrap; }
.dir.d-env { background: var(--sobe); }
.dir.d-rec { background: var(--desce); }
.pista { position: relative; height: 120px; border-radius: 14px; background: linear-gradient(var(--surface-2), var(--surface-2)) center 78% / 100% 6px no-repeat, var(--surface); border: 1px solid var(--border); margin: 0 8px; }
.jogador { position: absolute; bottom: 14px; transform: translateX(-50%); transition: left 60ms linear; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.jogador .corpo { width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 2px 6px rgb(0 0 0 / 0.25); }
.jogador .nome { font-size: 0.75rem; font-weight: 700; white-space: nowrap; background: var(--surface); padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); }
.pista .vazio-pista { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-style: italic; }

.diagrama { width: 100%; height: auto; display: block; }
.dg-caixa { fill: var(--surface-2); stroke: var(--border); stroke-width: 1.3; }
.dg-caixa.destaque { fill: color-mix(in srgb, var(--ws) 12%, var(--surface)); stroke: var(--ws); }
.dg-caixa.http { fill: color-mix(in srgb, var(--http) 12%, var(--surface)); stroke: var(--http); }
.dg-txt { font: 600 16px system-ui, sans-serif; fill: var(--text); }
.dg-sub { font: 13px var(--mono); fill: var(--muted); }
.dg-ponta.desce { fill: var(--desce); }
.dg-lig { fill: none; stroke-width: 2; }
.dg-lig.sobe { stroke: var(--sobe); }
.dg-lig.desce { stroke: var(--desce); }
.dg-lig.cinza { stroke: var(--vazio); stroke-dasharray: 5 4; }
.dg-lig.ws { stroke: var(--ws); }
.dg-rot { font: 700 13px var(--mono); }
.dg-rot.sobe { fill: var(--sobe); }
.dg-rot.desce { fill: var(--desce); }
.dg-rot.ws { fill: var(--ws); }
.dg-rot.erro { fill: var(--erro); }

/* ---------- erro e rodape ---------- */
.falha-caixa { border: 1px solid var(--erro); background: color-mix(in srgb, var(--erro) 8%, var(--surface)); border-radius: var(--raio); padding: 16px 20px; }
.falha-caixa strong { color: var(--erro); }
.falha-caixa pre { white-space: pre-wrap; font-size: 0.82rem; margin: 8px 0 0; }

.rodape {
	max-width: 1280px; margin: 36px auto 0; padding-top: 18px; border-top: 1px solid var(--border);
	display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
}
.rodape a { text-decoration: none; font-weight: 600; padding: 8px 12px; border-radius: 8px; }
.rodape a:hover { background: var(--surface-2); }
.rodape .prox { justify-self: end; text-align: right; }
.rodape .ant { justify-self: start; }
.rodape .pos { color: var(--muted); font-size: 0.85rem; font-family: var(--mono); }

@media (max-width: 1100px) {
	.grade-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
	html { font-size: 16px; }
	.layout { grid-template-columns: minmax(0, 1fr); }
	.menu {
		position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border);
		display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px;
	}
	.menu h4 { display: none; }
	.menu a { white-space: nowrap; flex: none; }
	.conteudo { padding: 20px 16px 32px; }
	.grade-2, .grade-3 { grid-template-columns: minmax(0, 1fr); }
	.pag-cab h1 { font-size: 1.6rem; }
	.marca span, .link-sistema.extra { display: none; }
	.log li { grid-template-columns: 5.6em minmax(0, 1fr); }
	.log .hora { display: none; }
}

<body>
<header class="topo">
	<button id="btn-menu" class="icone" title="Mostrar/ocultar o menu (tecla M)" aria-label="Mostrar ou ocultar o menu">☰</button>
	<div class="marca">
		<strong>WebSocket</strong>
		<span>uma conexão aberta, os dois lados falam</span>
	</div>
	<div class="topo-dir">
		<a class="link-sistema" href="/chat/" target="_blank" title="O chat da aula">Chat ↗</a>
		<a class="link-sistema extra" href="/jogo/" target="_blank" title="O joguinho">Jogo ↗</a>
		<span id="saude" class="saude" title="Estado do backend">verificando o backend…</span>
		<button id="btn-tema" class="icone" title="Alternar tema claro/escuro" aria-label="Alternar tema"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg></button>
	</div>
</header>
<div class="layout">
	<nav id="menu" class="menu" aria-label="Roteiro da aula"></nav>
	<main id="conteudo" class="conteudo"></main>
</div>

<script>
'use strict';

/* =====================================================================
 * Utilitarios de DOM, de API e de WebSocket
 * ===================================================================== */
function el(tag, props, ...filhos) {
	const no = document.createElement(tag);
	for (const [chave, valor] of Object.entries(props || {})) {
		if (valor == null || valor === false) continue;
		if (chave === 'class') no.className = valor;
		else if (chave === 'html') no.innerHTML = valor;
		else if (chave.startsWith('on')) no.addEventListener(chave.slice(2), valor);
		else no.setAttribute(chave, valor === true ? '' : valor);
	}
	for (const filho of filhos.flat(Infinity)) {
		if (filho == null || filho === false) continue;
		no.append(filho instanceof Node ? filho : String(filho));
	}
	return no;
}

function escapar(texto) {
	return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function api(caminho, opcoes) {
	const resposta = await fetch(caminho, opcoes);
	const corpo = await resposta.json().catch(() => ({}));
	if (!resposta.ok) throw new Error(corpo.message || `HTTP ${resposta.status} em ${caminho}`);
	return corpo;
}

// Pagina em https precisa de wss:// (o navegador bloqueia ws:// numa pagina segura).
function urlWs(caminho) {
	return `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${caminho}`;
}

// No formato que o NestJS (WsAdapter) espera: {"event": "...", "data": ...}
function mandar(ws, event, data) {
	if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ event, data }));
}

function horaAgora() {
	const d = new Date();
	return `${d.toLocaleTimeString('pt-BR')}.${String(d.getMilliseconds()).padStart(3, '0').slice(0, 1)}`;
}

function lerNome() {
	try {
		return localStorage.getItem('nome') || '';
	} catch {
		return '';
	}
}

// Cada pagina pode abrir WebSockets e timers. Ao trocar de pagina, tudo e fechado.
let limpezas = [];
function aoSair(fn) {
	limpezas.push(fn);
}
function limparPagina() {
	for (const fn of limpezas.splice(0)) {
		try {
			fn();
		} catch {}
	}
}

/* =====================================================================
 * Realce de sintaxe (simples, so o suficiente para leitura em aula)
 * ===================================================================== */
const PALAVRAS_JS = [
	'const', 'let', 'new', 'return', 'this', 'true', 'false', 'null', 'await', 'async', 'function', 'if', 'else', 'for', 'of',
	'import', 'from', 'export', 'class', 'private', 'readonly', 'constructor', 'throw', 'typeof', 'implements', 'continue',
];

function realcarJs(codigo) {
	const re = new RegExp(`(\\/\\/[^\\n]*)|('(?:[^'\\\\\\n]|\\\\.)*'|"(?:[^"\\\\\\n]|\\\\.)*"|\`[^\`]*\`)|(@\\w+)|\\b(${PALAVRAS_JS.join('|')})\\b|\\b(\\d+)\\b`, 'g');
	return escapar(codigo).replace(re, (m, comentario, texto, decorador, palavra, numero) => {
		if (comentario) return `<span class="hl-c">${comentario}</span>`;
		if (texto) return `<span class="hl-s">${texto}</span>`;
		if (decorador) return `<span class="hl-a">${decorador}</span>`;
		if (palavra) return `<span class="hl-k">${palavra}</span>`;
		return `<span class="hl-n">${numero}</span>`;
	});
}

// Nginx e terminal: comentario com #.
function realcarConf(codigo) {
	return escapar(codigo).replace(/(#[^\n]*)|('[^'\n]*'|"[^"\n]*")|^(\s*[\w-]+)|(\$\w+)/gm, (m, comentario, texto, diretiva, variavel) => {
		if (comentario) return `<span class="hl-c">${comentario}</span>`;
		if (texto) return `<span class="hl-s">${texto}</span>`;
		if (diretiva) return `<span class="hl-k">${diretiva}</span>`;
		return `<span class="hl-a">${variavel}</span>`;
	});
}

function realcarJson(objeto) {
	return escapar(JSON.stringify(objeto, null, 2)).replace(
		/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\bnull\b|-?\b\d+(?:\.\d+)?\b/g,
		(m, texto, doisPontos, booleano) => {
			if (texto) return doisPontos ? `<span class="hl-jk">${texto}</span>${doisPontos}` : `<span class="hl-s">${texto}</span>`;
			if (booleano) return `<span class="hl-k">${m}</span>`;
			if (m === 'null') return `<span class="hl-c">null</span>`;
			return `<span class="hl-n">${m}</span>`;
		},
	);
}

function codigo(texto, { linguagem = 'js', titulo } = {}) {
	const html = linguagem === 'json' ? realcarJson(texto) : linguagem === 'conf' ? realcarConf(texto) : realcarJs(texto);
	return el('figure', { class: 'codigo' }, titulo && el('figcaption', {}, titulo), el('pre', { html }));
}

/* =====================================================================
 * Blocos de pagina
 * ===================================================================== */
function cabecalho(grupo, titulo, subtitulo, lead) {
	return el(
		'header',
		{ class: 'pag-cab' },
		el('div', { class: 'eyebrow' }, grupo),
		el('h1', {}, titulo, subtitulo && el('span', { class: 'sub' }, subtitulo)),
		lead && el('p', { class: 'lead' }, lead),
	);
}

function pergunta(texto, rotulo = 'Pergunta') {
	return el('div', { class: 'pergunta' }, el('span', { class: 'rot' }, rotulo), el('p', {}, texto));
}

function nota(tipo, rotulo, conteudo, extra) {
	return el(
		'aside',
		{ class: `nota ${tipo}` },
		el('span', { class: 'rot' }, rotulo),
		Array.isArray(conteudo) ? el('ul', {}, conteudo.map((item) => el('li', {}, item))) : el('p', {}, conteudo),
		extra,
	);
}

function secao(titulo, ajuda, ...filhos) {
	return el('section', { class: 'secao' }, el('h2', {}, titulo), ajuda && el('p', { class: 'ajuda' }, ajuda), filhos);
}

function cartao(titulo, ...filhos) {
	return el('div', { class: 'cartao' }, titulo && el('h3', {}, titulo), filhos);
}

function comClasse(no, classe) {
	no.classList.add(classe);
	return no;
}

function tabelaSimples(cabecas, linhas, classes = []) {
	return el(
		'div',
		{ class: 'tabela-wrap' },
		el(
			'table',
			{},
			el('thead', {}, el('tr', {}, cabecas.map((c) => el('th', {}, c)))),
			el('tbody', {}, linhas.map((linha) => el('tr', {}, linha.map((celula, i) => el('td', { class: classes[i] }, celula))))),
		),
	);
}

function contador(rotulo, classe) {
	const valor = el('b', {}, '0');
	return { no: el('div', { class: `contador ${classe || ''}` }, valor, el('span', {}, rotulo)), valor };
}

function caixaErro(erro) {
	return el(
		'div',
		{ class: 'falha-caixa' },
		el('strong', {}, 'Não consegui carregar esta página.'),
		el('p', {}, 'Confira se o backend está de pé (o indicador no topo mostra o estado).'),
		el('pre', {}, erro?.message || String(erro)),
	);
}

/* =====================================================================
 * Diagrama de sequencia: Navegador e Servidor, mensagens de cima para baixo.
 * passo: { de: 'n' | 's', texto, tipo: 'http' | 'vazio' | 'ws' } ou { nota }
 * Os passos do tipo 'ws' ficam dentro de uma faixa: a conexao aberta.
 * ===================================================================== */
function sequencia(passos, { largura = 380, passo = 40 } = {}) {
	const xN = 70;
	const xS = largura - 70;
	let y = 66;
	let corpo = '';
	let faixaIni = null;
	let faixaFim = null;
	for (const p of passos) {
		if (p.nota) {
			corpo += `<text class="seq-nota" x="${largura / 2}" y="${y - 4}" text-anchor="middle">${escapar(p.nota)}</text>`;
			y += passo * 0.7;
			continue;
		}
		const x1 = p.de === 'n' ? xN : xS;
		const x2 = p.de === 'n' ? xS : xN;
		const s = Math.sign(x2 - x1);
		if (p.tipo === 'ws') {
			faixaIni ??= y - 26;
			faixaFim = y + 26;
		}
		corpo += `<line class="seq-seta ${p.tipo}" x1="${x1}" y1="${y}" x2="${x2 - s * 8}" y2="${y}"/>`;
		corpo += `<path class="${p.tipo}" d="M${x2} ${y} l${-s * 10} -5 v10 z"/>`;
		corpo += `<text class="seq-texto ${p.tipo}" x="${(x1 + x2) / 2}" y="${y - 7}" text-anchor="middle">${escapar(p.texto)}</text>`;
		y += passo;
	}
	const altura = y - passo / 2 + 10;
	let fundo = '';
	for (const [x, nome] of [[xN, 'Navegador'], [xS, 'Servidor']]) {
		fundo += `<line class="seq-vida" x1="${x}" x2="${x}" y1="36" y2="${altura}"/>`;
		fundo += `<rect class="seq-ator" x="${x - 56}" y="4" width="112" height="32" rx="8"/><text class="seq-ator-txt" x="${x}" y="25" text-anchor="middle">${nome}</text>`;
	}
	if (faixaIni != null) {
		fundo += `<rect class="seq-faixa" x="${xN - 14}" y="${faixaIni}" width="${xS - xN + 28}" height="${faixaFim - faixaIni}" rx="8"/>`;
		fundo += `<text class="seq-faixa-txt" x="${largura / 2}" y="${faixaFim - 7}" text-anchor="middle">CONEXÃO ABERTA</text>`;
	}
	return el('div', { html: `<svg class="seq" viewBox="0 0 ${largura} ${altura}" role="img" aria-label="Diagrama de sequência">${fundo}${corpo}</svg>` });
}

/* =====================================================================
 * 1. O problema
 * ===================================================================== */
function paginaProblema(corpo) {
	corpo.append(
		cabecalho(
			'O problema',
			'No HTTP, quem pergunta é sempre o navegador',
			'request → response',
			'O servidor responde, mas nunca começa a conversa. Para uma página de notícias, ótimo. Para um chat, um jogo ou um painel ao vivo, o servidor precisa avisar o navegador no momento em que algo acontece.',
		),
		pergunta('Chegou uma mensagem nova no chat. Como o servidor avisa o navegador da Ana, se ela não perguntou nada?'),
		el(
			'div',
			{ class: 'grade-3' },
			cartao(
				'HTTP comum',
				sequencia([
					{ de: 'n', texto: 'GET /api/mensagens', tipo: 'http' },
					{ de: 's', texto: '200 OK [ ... ]', tipo: 'http' },
					{ nota: 'e acabou: o servidor não fala mais' },
				]),
				el('p', { class: 'rodape-cartao' }, 'Uma pergunta, uma resposta. Mensagem que chegar depois, o navegador só vê se perguntar de novo.'),
			),
			cartao(
				'Polling: perguntar toda hora',
				sequencia([
					{ de: 'n', texto: 'GET ?depois=41', tipo: 'vazio' },
					{ de: 's', texto: '200 []', tipo: 'vazio' },
					{ de: 'n', texto: 'GET ?depois=41', tipo: 'vazio' },
					{ de: 's', texto: '200 []', tipo: 'vazio' },
					{ de: 'n', texto: 'GET ?depois=41', tipo: 'http' },
					{ de: 's', texto: '200 [msg 42]', tipo: 'http' },
				]),
				el('p', { class: 'rodape-cartao' }, 'Funciona, mas quase toda resposta vem vazia, e a mensagem chega com atraso de até um intervalo inteiro.'),
			),
			cartao(
				'WebSocket',
				sequencia([
					{ de: 'n', texto: 'GET  Upgrade: websocket', tipo: 'http' },
					{ de: 's', texto: '101 Switching Protocols', tipo: 'http' },
					{ de: 's', texto: 'msg 42', tipo: 'ws' },
					{ de: 'n', texto: 'msg 43', tipo: 'ws' },
					{ de: 's', texto: 'msg 43', tipo: 'ws' },
					{ de: 's', texto: 'msg 44', tipo: 'ws' },
				]),
				el('p', { class: 'rodape-cartao' }, 'Começa como HTTP e vira outra coisa: uma conexão que fica aberta, na qual os dois lados mandam quando quiserem.'),
			),
		),
		el(
			'div',
			{ class: 'grade-2' },
			nota('', 'WebSocket, em uma frase', [
				'Um protocolo (RFC 6455, de 2011) para uma conexão TCP que fica aberta entre navegador e servidor.',
				'Full-duplex: os dois lados mandam mensagens a qualquer momento, sem esperar o outro.',
				'Começa com uma requisição HTTP comum, na mesma porta do site, e por isso passa por firewall e proxy.',
			]),
			nota('dica', 'Outras saídas que existem', [
				'Long polling: o servidor segura a resposta até ter novidade. Menos requisições vazias, mas uma por mensagem.',
				'SSE (Server-Sent Events, o EventSource do navegador): o servidor manda um fluxo de eventos sobre HTTP. Só vai do servidor para o navegador.',
				'Na última tela tem uma tabela comparando tudo.',
			]),
		),
	);
}

/* =====================================================================
 * 2. Polling x WebSocket, ao vivo
 * ===================================================================== */
function paginaPolling(corpo) {
	let intervaloMs = 2000;
	let ultimoId = 0;
	let timer = null;
	const chegouNoWs = new Map();

	const reqs = contador('requisições');
	const vazias = contador('voltaram vazias', 'ruim');
	const comNovidade = contador('com novidade', 'bom');
	const framesWs = contador('frames recebidos', 'bom');
	const faixa = el('div', { class: 'faixa-req', title: 'Cada quadradinho é uma requisição. Verde: trouxe mensagem nova.' });
	const feedHttp = el('ul', { class: 'feed' }, el('li', { class: 'vazio-feed' }, 'mande uma mensagem e veja quando ela aparece aqui'));
	const feedWs = el('ul', { class: 'feed' }, el('li', { class: 'vazio-feed' }, 'a conexão está aberta, esperando o servidor falar'));

	function adicionar(feed, mensagem, atraso) {
		feed.querySelector('.vazio-feed')?.remove();
		feed.prepend(el('li', {}, el('span', { class: 'autor' }, `${mensagem.autor}:`), el('span', {}, mensagem.texto), atraso));
		while (feed.children.length > 30) feed.lastChild.remove();
	}

	async function perguntar() {
		try {
			const { data } = await api(`/api/mensagens?depois=${ultimoId}`);
			reqs.valor.textContent = Number(reqs.valor.textContent) + 1;
			faixa.append(el('i', { class: data.length ? 'novidade' : null }));
			while (faixa.children.length > 90) faixa.firstChild.remove();
			if (!data.length) {
				vazias.valor.textContent = Number(vazias.valor.textContent) + 1;
				return;
			}
			comNovidade.valor.textContent = Number(comNovidade.valor.textContent) + 1;
			for (const m of data) {
				ultimoId = Math.max(ultimoId, m.id);
				const t = chegouNoWs.get(m.id);
				const segundos = t ? ((performance.now() - t) / 1000).toFixed(1).replace('.', ',') : null;
				adicionar(feedHttp, m, el('span', { class: 'atraso lento' }, segundos ? `${segundos} s depois do WebSocket` : 'chegou'));
			}
		} catch {}
	}

	function agendar(ms) {
		intervaloMs = ms;
		clearInterval(timer);
		timer = setInterval(perguntar, intervaloMs);
		botoesIntervalo.forEach((b) => b.classList.toggle('ativo', Number(b.dataset.ms) === ms));
	}

	const botoesIntervalo = [1000, 2000, 5000].map((ms) => el('button', { 'data-ms': ms, onclick: () => agendar(ms) }, `a cada ${ms / 1000} s`));

	// A primeira pergunta so marca de onde comecar: o que ja existia nao conta como novidade.
	let naPagina = true;
	api('/api/mensagens').then(({ data }) => {
		if (!naPagina) return;
		ultimoId = data.reduce((maior, m) => Math.max(maior, m.id), 0);
		agendar(intervaloMs);
	});

	const ws = new WebSocket(urlWs('/ws/chat'));
	ws.addEventListener('message', (e) => {
		const { event, data } = JSON.parse(e.data);
		framesWs.valor.textContent = Number(framesWs.valor.textContent) + 1;
		if (event !== 'mensagem') return;
		chegouNoWs.set(data.id, performance.now());
		adicionar(feedWs, data, el('span', { class: 'atraso rapido' }, 'na hora'));
	});

	aoSair(() => {
		naPagina = false;
		clearInterval(timer);
		ws.close(1000, 'saiu da página');
	});

	const nome = el('input', { class: 'entrada curta', placeholder: 'seu nome', value: lerNome() || 'Professor', maxlength: 24 });
	const texto = el('input', { class: 'entrada', placeholder: 'mensagem para o chat', maxlength: 500 });
	function enviar(ev) {
		ev.preventDefault();
		if (!texto.value.trim()) return;
		mandar(ws, 'mensagem', { autor: nome.value, texto: texto.value });
		texto.value = '';
	}

	corpo.append(
		cabecalho(
			'O problema',
			'Polling × WebSocket, ao vivo',
			'o mesmo chat, dos dois jeitos',
			'Os dois painéis acompanham o chat da aula. O da esquerda pergunta ao servidor de tempos em tempos (GET /api/mensagens). O da direita tem uma conexão WebSocket aberta e só espera.',
		),
		cartao(
			'Mande uma mensagem (vai para o chat de verdade, em /chat/)',
			el('form', { class: 'linha-form', onsubmit: enviar }, nome, texto, el('button', { class: 'botao' }, 'Enviar')),
		),
		el(
			'div',
			{ class: 'grade-2' },
			comClasse(
				cartao(
					'Polling: GET /api/mensagens?depois=N',
					el('div', { class: 'alternar' }, botoesIntervalo),
					el('div', { class: 'contadores' }, reqs.no, vazias.no, comNovidade.no),
					faixa,
					feedHttp,
				),
				'lado-http',
			),

/* =====================================================================
 * 3. Handshake
 * ===================================================================== */
const CABECALHOS_WS = ['upgrade', 'connection', 'sec-websocket-key', 'sec-websocket-version', 'sec-websocket-extensions', 'sec-websocket-accept', 'sec-websocket-protocol', 'origin'];

function mensagemHttp(linha, cabecalhos) {
	const linhas = [`<span class="linha1">${escapar(linha)}</span>`];
	for (const [nome, valor] of cabecalhos) {
		const destaque = CABECALHOS_WS.includes(nome.toLowerCase());
		linhas.push(`<span class="${destaque ? 'chave-ws' : ''}"><span class="nome-cab">${escapar(nome)}:</span> ${escapar(valor)}</span>`);
	}
	return el('pre', { html: linhas.join('\n') });
}

async function sha1Base64(texto) {
	// crypto.subtle so existe em contexto seguro (https ou localhost).
	if (!globalThis.crypto?.subtle) return null;
	const hash = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(texto));
	return btoa(String.fromCharCode(...new Uint8Array(hash)));
}

function paginaHandshake(corpo) {

		ws = new WebSocket(urlWs('/ws/laboratorio'));

			resposta.querySelector('pre').replaceWith(mensagemHttp(data.resposta.linha, data.resposta.cabecalhos));

			const c = data.calculo;
			const respondido = data.resposta.cabecalhos.find(([nome]) => nome.toLowerCase() === 'sec-websocket-accept')?.[1];
			const local = await sha1Base64(c.chave + c.guid);

/* =====================================================================
 * 4. O frame
 * ===================================================================== */
const OPCODES = [
	['0x0', 'continuação', 'pedaço de uma mensagem fatiada em vários frames'],
	['0x1', 'texto', 'UTF-8. O JSON do chat vai assim'],
	['0x2', 'binário', 'bytes quaisquer (imagem, áudio, protocolo próprio)'],
	['0x8', 'close', 'quero fechar; leva um código e um motivo'],
	['0x9', 'ping', '"você está aí?"'],
	['0xA', 'pong', '"estou". O navegador responde sozinho'],
];

const hex = (b) => b.toString(16).padStart(2, '0').toUpperCase();
const bin = (b) => b.toString(2).padStart(8, '0');

function montarFrame(texto, mascarar) {
	const dados = new TextEncoder().encode(texto);
	const n = dados.length;
	const len7 = n <= 125 ? n : n <= 0xffff ? 126 : 127;
	const b0 = 0x80 | 0x1; // FIN = 1, opcode = 1 (texto)
	const b1 = (mascarar ? 0x80 : 0) | len7;
	const estendido = len7 === 126 ? [n >> 8, n & 0xff] : len7 === 127 ? [0, 0, 0, 0, (n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff] : [];
	const chave = mascarar ? [...crypto.getRandomValues(new Uint8Array(4))] : [];
	const noFio = mascarar ? dados.map((b, i) => b ^ chave[i % 4]) : dados;
	return { b0, b1, len7, estendido, chave, dados: [...dados], noFio: [...noFio], cabecalho: 2 + estendido.length + chave.length };
}

function bitsDoByte(b, campos) {
	const bits = bin(b).split('');
	return el('div', { class: 'bits' }, campos.map(([classe, rotulo], i) => el('div', { class: `bit ${classe}` }, el('b', {}, bits[i]), el('small', {}, rotulo))));
}

function paginaFrame(corpo) {
	let mascarar = true;
	const entrada = el('input', { class: 'entrada', value: '{"event":"mensagem","data":{"autor":"Ana","texto":"oi"}}', maxlength: 70000 });
	const saida = el('div', { class: 'secao' });
	const sentido = el(
		'div',
		{ class: 'alternar' },
		el('button', { class: 'ativo', 'data-m': '1' }, 'navegador → servidor'),
		el('button', { 'data-m': '0' }, 'servidor → navegador'),
	);
	sentido.addEventListener('click', (ev) => {
		const b = ev.target.closest('button');
		if (!b) return;
		mascarar = b.dataset.m === '1';
		sentido.querySelectorAll('button').forEach((x) => x.classList.toggle('ativo', x === b));
		desenhar();
	});

	function desenhar() {
		const f = montarFrame(entrada.value, mascarar);
		const mostrar = 24;
		const bytes = [
			el('span', { class: 'byte c-b0', title: 'FIN + RSV + opcode' }, hex(f.b0)),
			el('span', { class: 'byte c-b1', title: 'MASK + tamanho' }, hex(f.b1)),
			f.estendido.map((b) => el('span', { class: 'byte c-ext', title: 'tamanho estendido' }, hex(b))),
			f.chave.map((b) => el('span', { class: 'byte c-chave', title: 'chave da máscara' }, hex(b))),
			f.noFio.slice(0, mostrar).map((b) => el('span', { class: 'byte c-dados', title: mascarar ? 'dados mascarados' : 'dados' }, hex(b))),
			f.noFio.length > mostrar && el('span', { class: 'byte c-mais' }, `+${f.noFio.length - mostrar} bytes`),
		];

		const leituraLen =
			f.len7 === 126 ? `126: o tamanho real está nos 2 próximos bytes (${f.dados.length})` : f.len7 === 127 ? `127: o tamanho real está nos 8 próximos bytes (${f.dados.length})` : `${f.len7} bytes de dados`;

		const colunas = Math.min(f.dados.length, 12);
		const caracteres = [];
		{
			let i = 0;
			for (const ch of entrada.value) {
				const tam = new TextEncoder().encode(ch).length;
				for (let k = 0; k < tam && i < colunas; k++, i++) caracteres.push(k === 0 ? ch : '↳');
				if (i >= colunas) break;
			}
		}
		const tabelaXor = mascarar
			? el(

					{ class: 'tabela-wrap' },
					el(
						'table',
						{ class: 'xor' },
						el('thead', {}, el('tr', {}, el('th', {}, ''), caracteres.map((c) => el('th', {}, c === ' ' ? '␠' : c)))),
						el(
							'tbody',
							{},
							el('tr', { class: 'r-dado' }, el('td', {}, 'dado (UTF-8)'), f.dados.slice(0, colunas).map((b) => el('td', {}, hex(b)))),
							el('tr', { class: 'r-chave' }, el('td', {}, 'XOR chave'), f.dados.slice(0, colunas).map((_, i) => el('td', {}, hex(f.chave[i % 4])))),
							el('tr', { class: 'r-fio' }, el('td', {}, '= no fio'), f.noFio.slice(0, colunas).map((b) => el('td', {}, hex(b)))),
						),
					),
				)
			: null;

		saida.replaceChildren(
			cartao(
				'O frame inteiro, byte a byte',
				el('div', { class: 'bytes' }, bytes),
				el(
					'div',
					{ class: 'legenda-bytes' },
					el('span', {}, el('i', { style: 'background:var(--f-op)' }), 'FIN + opcode'),
					el('span', {}, el('i', { style: 'background:var(--f-len)' }), 'MASK + tamanho'),
					f.estendido.length > 0 && el('span', {}, el('i', { style: 'background:color-mix(in srgb, var(--f-len) 70%, #000)' }), 'tamanho estendido'),
					mascarar && el('span', {}, el('i', { style: 'background:var(--f-chave)' }), 'chave da máscara'),
					el('span', {}, el('i', { style: 'background:var(--f-dados)' }), mascarar ? 'dados (mascarados)' : 'dados'),
				),
				el(
					'div',
					{ class: 'totais' },
					contadorFixo(f.cabecalho, 'bytes de cabeçalho'),
					contadorFixo(f.dados.length, 'bytes de dados'),
					contadorFixo(f.cabecalho + f.dados.length, 'bytes no total'),
					contadorFixo([...entrada.value].length, 'caracteres digitados'),
				),
			),
			el(
				'div',
				{ class: 'grade-2' },
				cartao(
					`Byte 1: 0x${hex(f.b0)}`,
					bitsDoByte(f.b0, [['fin', 'FIN'], ['rsv', 'RSV1'], ['rsv', 'RSV2'], ['rsv', 'RSV3'], ['op', 'opcode'], ['op', 'opcode'], ['op', 'opcode'], ['op', 'opcode']]),
					el('p', { class: 'leitura' }, el('b', {}, 'FIN = 1'), ': última (e única) parte da mensagem. ', el('b', {}, 'opcode = 0001'), ': frame de texto.'),
				),
				cartao(
					`Byte 2: 0x${hex(f.b1)}`,
					bitsDoByte(f.b1, [['mask', 'MASK'], ['len', 'tam'], ['len', 'tam'], ['len', 'tam'], ['len', 'tam'], ['len', 'tam'], ['len', 'tam'], ['len', 'tam']]),
					el('p', { class: 'leitura' }, el('b', {}, `MASK = ${mascarar ? 1 : 0}`), mascarar ? ': os dados vêm mascarados. ' : ': sem máscara (servidor nunca mascara). ', el('b', {}, `tamanho = ${f.len7}`), `: ${leituraLen}.`),
				),
			),
			mascarar
				? cartao(
						'A máscara: cada byte dos dados passa por um XOR com a chave',
						tabelaXor,
						el('p', { class: 'rodape-cartao' }, `Chave deste frame: ${f.chave.map(hex).join(' ')}. Ela muda a cada frame e vai junto, no próprio frame: qualquer um que veja o tráfego desfaz o XOR. Por isso a máscara não é criptografia.`),
					)
				: nota('', 'Do servidor para o navegador', 'Sem chave e sem máscara: os bytes dos dados vão como estão. Mudar o sentido não muda o JSON, só o cabeçalho, que fica 4 bytes menor.'),
		);
	}

	function contadorFixo(valor, rotulo) {
		return el('div', { class: 'contador' }, el('b', {}, valor), el('span', {}, rotulo));
	}

	const exemplos = [
		['oi', 'oi'],
		['JSON do chat', '{"event":"mensagem","data":{"autor":"Ana","texto":"oi"}}'],
		['acentos e emoji', 'ação 🚀'],
		['130 caracteres', 'x'.repeat(130)],
		['70 mil caracteres', 'x'.repeat(70000)],
	];

	entrada.addEventListener('input', desenhar);
	desenhar();

	corpo.append(
		cabecalho(
			'O protocolo',
			'O frame',
			'o envelope de cada mensagem',
			'Depois do handshake, tudo o que passa na conexão são frames. O cabeçalho tem de 2 a 14 bytes: bem diferente das centenas de bytes de cabeçalho de cada requisição HTTP.',
		),
		cartao(
			'Monte um frame',
			el('div', { class: 'linha-form' }, entrada),
			el('div', { class: 'botoes' }, sentido, exemplos.map(([rotulo, valor]) => el('button', { class: 'botao sec', onclick: () => ((entrada.value = valor), desenhar()) }, rotulo))),
		),
		saida,
		el(
			'div',
			{ class: 'grade-2' },
			secao('Os tipos de frame (opcode)', null, tabelaSimples(['opcode', 'tipo', 'para quê'], OPCODES, ['mono nowrap', 'nowrap', ''])),
			el(
				'div',
				{ class: 'secao' },
				nota('repare', 'Repare', [
					'O tamanho é em bytes, não em caracteres: "ç" ocupa 2 bytes em UTF-8, e um emoji ocupa 4.',
					'Até 125 bytes, o tamanho cabe no próprio byte 2. Acima disso, o valor 126 avisa "o tamanho vem nos 2 bytes seguintes", e 127 avisa "vem nos 8 seguintes".',
					'O navegador é obrigado a mascarar tudo o que manda. O servidor nunca mascara. Um servidor que receber um frame sem máscara do navegador fecha a conexão.',
				]),
				nota(
					'dica',
					'Por que existe a máscara?',
					'Por causa de proxies antigos que não entendiam WebSocket. Se o JavaScript de um site controlasse os bytes exatos que saem no fio, poderia montar algo que parece uma requisição HTTP e envenenar o cache do proxy. Com a máscara aleatória, quem escolhe os bytes é o navegador, não a página.',
				),
			),
		),
	);
}

/* =====================================================================
 * Laboratorio: conexao com /ws/laboratorio e o log dos eventos
 * ===================================================================== */
const NOMES_ESTADO = ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'];

function laboratorio() {
	let ws = null;
	const estados = NOMES_ESTADO.map((nome, i) => el('div', { class: 'estado' }, nome, el('small', {}, `readyState ${i}`)));
	const log = el('ul', { class: 'log' }, el('li', { class: 'vazio-log' }, 'nenhum evento ainda: clique em Conectar'));
	const texto = el('input', { class: 'entrada', value: 'oi, servidor', maxlength: 2000 });
	const botoes = {};

	function registrar(tipo, rotulo, detalhe) {
		log.querySelector('.vazio-log')?.remove();
		log.append(el('li', { class: `t-${tipo}` }, el('span', { class: 'hora' }, horaAgora()), el('span', { class: 'tipo' }, rotulo), el('span', { class: 'txt' }, detalhe)));
		while (log.children.length > 200) log.firstChild.remove();
		log.scrollTop = log.scrollHeight;
	}

	function atualizar() {
		const estado = ws ? ws.readyState : 3;
		estados.forEach((e, i) => e.classList.toggle('on', i === estado));
		const aberta = estado === WebSocket.OPEN;
		botoes.conectar.disabled = estado === WebSocket.OPEN || estado === WebSocket.CONNECTING;
		for (const nome of ['eco', 'rajada', 'grande', 'fechar', 'servidor']) botoes[nome].disabled = !aberta;
	}

	function enviar(data) {
		const frame = JSON.stringify({ event: 'eco', data });
		ws.send(frame);
		registrar('env', '↑ enviada', frame.length > 160 ? `${frame.slice(0, 160)}… (${frame.length} caracteres)` : frame);
	}

	function conectar() {
		ws = new WebSocket(urlWs('/ws/laboratorio'));
		registrar('info', 'new', `new WebSocket("${ws.url}")`);
		atualizar();
		ws.addEventListener('open', () => {
			registrar('open', 'open', 'handshake concluído (101): conexão aberta');
			atualizar();
		});
		ws.addEventListener('message', (e) => {
			const resumo = e.data.length > 160 ? `${e.data.slice(0, 160)}… (${e.data.length} caracteres)` : e.data;
			registrar('rec', '↓ recebida', resumo);
		});
		ws.addEventListener('error', () => registrar('error', 'error', 'algo deu errado (o navegador não conta o quê: veja o DevTools)'));
		ws.addEventListener('close', (e) => {
			registrar('close', 'close', `código ${e.code}${e.reason ? `, motivo "${e.reason}"` : ''}, wasClean = ${e.wasClean}`);
			atualizar();
		});
	}

	botoes.conectar = el('button', { class: 'botao', onclick: conectar }, 'Conectar');
	botoes.eco = el('button', { class: 'botao sec', onclick: () => enviar(texto.value) }, 'Enviar');
	botoes.rajada = el('button', { class: 'botao sec', onclick: () => Array.from({ length: 10 }, (_, i) => enviar(`mensagem ${i + 1} de 10`)) }, 'Mandar 10 seguidas');
	botoes.grande = el('button', { class: 'botao sec', onclick: () => enviar('x'.repeat(300)) }, 'Mandar uma grande (300 bytes)');
	botoes.fechar = el(
		'button',
		{
			class: 'botao sec',
			onclick: () => {
				registrar('info', 'close()', 'ws.close(1000, "tchau")');
				ws.close(1000, 'tchau');
				atualizar();
			},
		},
		'Eu fecho (1000)',
	);
	botoes.servidor = el(
		'button',
		{
			class: 'botao perigo',
			onclick: () => {
				ws.send(JSON.stringify({ event: 'fechar' }));
				registrar('env', '↑ enviada', '{"event":"fechar"}');
			},
		},
		'Servidor fecha (4000)',
	);

	atualizar();
	aoSair(() => ws?.close(1000, 'saiu da página'));

	return el(
		'div',
		{ class: 'cartao' },
		el('h3', {}, 'Laboratório', el('span', { class: 'qtd' }, 'conexão com /ws/laboratorio: o servidor devolve tudo o que recebe')),
		el('div', { class: 'estados' }, estados.flatMap((e, i) => (i ? [el('span', { class: 'seta' }, '→'), e] : [e]))),
		el('div', { class: 'linha-form' }, botoes.conectar, texto, botoes.eco),
		el('div', { class: 'botoes' }, botoes.rajada, botoes.grande, botoes.fechar, botoes.servidor, el('button', { class: 'botao sec', onclick: () => log.replaceChildren() }, 'Limpar o log')),
		log,
	);
}

@WebSocketGateway({ path: '/ws/chat' })
export class ChatGateway {
  constructor(private readonly chatService: ChatService) {}

  // Depois do handshake (o 101), a conexao esta aberta.
  handleConnection(cliente: WebSocket) {
    this.chatService.entrar(cliente);
  }

  // Fechou: close, aba fechada ou o heartbeat derrubou.
  handleDisconnect(cliente: WebSocket) {
    this.chatService.sair(cliente);
  }

  // Chega: {"event":"mensagem","data":{"autor":"Ana",...}}
  @SubscribeMessage('mensagem')
  mensagem(@MessageBody() data) {
    const { autor, texto } = data ?? {};
    this.chatService.publicar(autor, texto, 'websocket');
  }
}`;

const CODIGO_TRANSMITIR = `// src/shared/ws/enviar.ts
// O protocolo nao tem "mandar para todos": o servidor
// manda o mesmo texto para cada conexao, uma por uma.
export function transmitir(clientes, event, data) {
  const texto = JSON.stringify({ event, data });

  for (const cliente of clientes) {
    if (cliente.readyState === WebSocket.OPEN) {
      cliente.send(texto);
    }
  }
}`;

function desenharPista(pista, jogadores, meuId) {
	if (!jogadores.length) {
		pista.replaceChildren(el('div', { class: 'vazio-pista' }, 'ninguém jogando ainda'));
		return;
	}
	pista.querySelector('.vazio-pista')?.remove();
	const vistos = new Set();
	for (const j of jogadores) {
		vistos.add(String(j.id));
		let no = pista.querySelector(`[data-id="${j.id}"]`);
		if (!no) {
			no = el('div', { class: 'jogador', 'data-id': j.id }, el('span', { class: 'nome' }), el('div', { class: 'corpo' }));
			pista.append(no);
		}
		no.querySelector('.nome').textContent = j.id === meuId ? `${j.nome} (você)` : j.nome;
		no.querySelector('.corpo').style.background = j.cor;
		no.style.left = `${j.x}%`;
	}
	for (const no of pista.querySelectorAll('.jogador')) if (!vistos.has(no.dataset.id)) no.remove();
}

/* =====================================================================
 * Roteiro (ordem da aula), menu e navegacao
 * ===================================================================== */
const PAGINAS = [
	{ rota: 'problema', grupo: 'O problema', menu: 'HTTP só responde', render: paginaProblema },
	{ rota: 'polling', grupo: 'O problema', menu: 'Polling × WebSocket', render: paginaPolling },
	{ rota: 'handshake', grupo: 'O protocolo', menu: 'O handshake', render: paginaHandshake },
	{ rota: 'frame', grupo: 'O protocolo', menu: 'O frame', render: paginaFrame },
	{ rota: 'api', grupo: 'No navegador', menu: 'A API e o ciclo de vida', render: paginaApi },
	{ rota: 'devtools', grupo: 'No navegador', menu: 'Vendo no DevTools', render: paginaDevtools },
	{ rota: 'backend', grupo: 'No código', menu: 'O gateway no NestJS', render: paginaBackend },
	{ rota: 'chat', grupo: 'Os sistemas', menu: 'O chat', render: paginaChat },
	{ rota: 'jogo', grupo: 'Os sistemas', menu: 'O jogo', render: paginaJogo },
	{ rota: 'vida-real', grupo: 'Na vida real', menu: 'Quando usar e produção', render: paginaVidaReal },
];

function montarMenu() {
	const menu = document.getElementById('menu');
	let grupoAtual = null;
	PAGINAS.forEach((p, i) => {
		if (p.grupo !== grupoAtual) {
			grupoAtual = p.grupo;
			menu.append(el('h4', {}, p.grupo));
		}
		menu.append(el('a', { href: `#/${p.rota}`, 'data-rota': p.rota }, el('span', { class: 'num' }, i + 1), p.menu));
	});
}

function indiceAtual() {
	const rota = location.hash.replace(/^#\/?/, '');
	return Math.max(0, PAGINAS.findIndex((p) => p.rota === rota));
}

function rodape(i) {
	const anterior = PAGINAS[i - 1];
	const proxima = PAGINAS[i + 1];
	return el(
		'nav',
		{ class: 'rodape', 'aria-label': 'Navegação entre páginas' },
		anterior ? el('a', { class: 'ant', href: `#/${anterior.rota}` }, `← ${anterior.menu}`) : el('span'),
		el('span', { class: 'pos' }, `${i + 1} / ${PAGINAS.length}`),
		proxima ? el('a', { class: 'prox', href: `#/${proxima.rota}` }, `${proxima.menu} →`) : el('span'),
	);
}

function navegar() {
	limparPagina();
	const i = indiceAtual();
	const pagina = PAGINAS[i];
	document.querySelectorAll('#menu a').forEach((a) => a.classList.toggle('ativo', a.dataset.rota === pagina.rota));
	document.querySelector('#menu a.ativo')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });

	const corpo = el('div', { class: 'pagina' });
	try {
		pagina.render(corpo);
	} catch (erro) {
		corpo.replaceChildren(caixaErro(erro));
	}
	document.getElementById('conteudo').replaceChildren(corpo, rodape(i));
	window.scrollTo(0, 0);
}

function irPara(passo) {
	const destino = PAGINAS[indiceAtual() + passo];
	if (destino) location.hash = `#/${destino.rota}`;
}

/* =====================================================================
 * Topo: estado do backend, tema e menu
 * ===================================================================== */
// De proposito, por polling: um numero que muda devagar e pode chegar atrasado.
async function verificarBackend() {
	const selo = document.getElementById('saude');
	try {
		const r = await api('/health-check');
		const total = Object.values(r.conexoes).reduce((a, b) => a + b, 0);
		selo.className = 'saude ok';
		selo.textContent = `backend ok · ${total} ${total === 1 ? 'conexão aberta' : 'conexões abertas'}`;
		selo.title = Object.entries(r.conexoes).map(([canal, n]) => `${canal}: ${n}`).join('\n') + '\n(atualizado por polling, a cada 10 s)';
	} catch (erro) {
		selo.className = 'saude falha';
		selo.textContent = 'backend indisponível';
		selo.title = erro.message;
	}
}

function lerPreferencia(chave) {
	try {
		return localStorage.getItem(chave);
	} catch {
		return null;
	}
}

function gravarPreferencia(chave, valor) {
	try {
		localStorage.setItem(chave, valor);
	} catch {}
}

function alternarMenu() {
	document.body.classList.toggle('sem-menu');
	gravarPreferencia('menu', document.body.classList.contains('sem-menu') ? 'oculto' : 'visivel');
}

function alternarTema() {
	const raiz = document.documentElement;
	const escuroAgora = raiz.dataset.theme ? raiz.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
	raiz.dataset.theme = escuroAgora ? 'light' : 'dark';
	gravarPreferencia('tema', raiz.dataset.theme);
}

const temaSalvo = lerPreferencia('tema');
if (temaSalvo) document.documentElement.dataset.theme = temaSalvo;
if (lerPreferencia('menu') === 'oculto') document.body.classList.add('sem-menu');

document.getElementById('btn-menu').addEventListener('click', alternarMenu);
document.getElementById('btn-tema').addEventListener('click', alternarTema);

// Setas e PageUp/PageDown (passador de slides) andam pelo roteiro; M esconde o menu.
document.addEventListener('keydown', (ev) => {
	if (ev.altKey || ev.ctrlKey || ev.metaKey || ev.target.closest?.('input, textarea, select')) return;
	if (ev.key === 'ArrowRight' || ev.key === 'PageDown') irPara(1);
	else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') irPara(-1);
	else if (ev.key === 'm' || ev.key === 'M') alternarMenu();
	else return;
	ev.preventDefault();
});

window.addEventListener('hashchange', navegar);
montarMenu();
navegar();
verificarBackend();
setInterval(verificarBackend, 10000);
</script>
