<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busca de Nomes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
    [hidden] { display: none !important; }
    input {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1.1rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
    }
    input:focus { outline: 2px solid #38bdf8; border-color: transparent; }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }
    .campo { margin-bottom: 1rem; }
    button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    button:disabled { opacity: 0.6; cursor: progress; }
    #login {
      max-width: 380px;
      margin: 3rem auto 0;
      padding: 1.75rem;
      background: #172033;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }
    #login h1 { font-size: 1.25rem; }
    #login button { width: 100%; }
    #topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    #topo h1 { margin: 0; }
    #sair {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
    }
    #sair:hover { background: #1e293b; color: #e2e8f0; }
    #meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 1rem 0;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    #servidor {
      font-weight: 700;
      color: #fbbf24;
      font-family: ui-monospace, monospace;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e293b;
      font-size: 1.05rem;
    }
    li:nth-child(odd) { background: #172033; }
    .vazio { color: #64748b; padding: 1rem; }
    .erro {
      color: #fca5a5;
      background: #3f1d1d;
      border-radius: 8px;
      border-bottom: none;
    }
    #erro-login {
      color: #fca5a5;
      font-size: 0.9rem;
      margin: 0 0 1rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main>
    <!-- Tela de login -->
    <section id="login" hidden>
      <h1>Entrar</h1>
      <form id="form-login">
        <div class="campo">
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" autocomplete="username" autofocus required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <p id="erro-login"></p>
        <button type="submit" id="botao-entrar">Entrar</button>
      </form>
    </section>

    <!-- App, só aparece com sessão válida -->
    <section id="app" hidden>
      <div id="topo">
        <h1>Busca de Nomes</h1>
        <button id="sair" type="button">Sair (<span id="quem"></span>)</button>
      </div>
      <input id="busca" type="search" placeholder="Digite parte de um nome..." autocomplete="off">
      <div id="meta">
        <span id="contagem"></span>
        <span>respondido por <span id="servidor">—</span></span>
      </div>
      <ul id="resultado"></ul>
    </section>
  </main>

  <script>
    // Vazio = mesma origem (o Nginx faz o proxy de /api).
    // Se a API estiver em outro domínio, coloque aqui a URL completa —
    // é a partir daí que o CORS entra em cena.
    const API = '';

    const telaLogin = document.getElementById('login');
    const telaApp = document.getElementById('app');
    const formLogin = document.getElementById('form-login');
    const botaoEntrar = document.getElementById('botao-entrar');
    const erroLogin = document.getElementById('erro-login');
    const quem = document.getElementById('quem');
    const campo = document.getElementById('busca');
    const lista = document.getElementById('resultado');
    const contagem = document.getElementById('contagem');
    const servidor = document.getElementById('servidor');

    let timer;

    // credentials: 'include' é o que manda o cookie junto.
    // Sem isso o navegador não envia cookie nenhum para outra origem.
    function chamar(caminho, opcoes = {}) {
      return fetch(API + caminho, { credentials: 'include', ...opcoes });
    }

    function mostrarLogin() {
      telaApp.hidden = true;
      telaLogin.hidden = false;
      document.getElementById('usuario').focus();
    }

    function mostrarApp(usuario) {
      telaLogin.hidden = true;
      telaApp.hidden = false;
      quem.textContent = usuario;
      campo.focus();
      buscar();
    }

    function mostrarErro(texto) {
      servidor.textContent = '—';
      contagem.textContent = '';
      lista.innerHTML = '<li class="erro"></li>';
      lista.firstChild.textContent = texto;
    }

    async function buscar() {
      const inicio = performance.now();

      let resposta;
      try {
        resposta = await chamar('/api/pessoas?busca=' + encodeURIComponent(campo.value));
      } catch (falha) {
        mostrarErro('Não foi possível falar com o servidor: ' + falha.message);
        return;
      }

      // Cookie expirado ou apagado: a sessão acabou, volta para o login.
      if (resposta.status === 401) {
        mostrarLogin();
        return;
      }

      if (!resposta.ok) {
        mostrarErro(`O servidor respondeu ${resposta.status} ${resposta.statusText}. ` +
          (resposta.status >= 502 ? 'O proxy não conseguiu falar com o backend.' : ''));
        return;
      }

      const json = await resposta.json();
      const ms = Math.round(performance.now() - inicio);

      servidor.textContent = json.servidor;
      contagem.textContent = `${json.total} resultado(s) em ${ms} ms`;

      lista.innerHTML = '';
      if (json.dados.length === 0) {
        lista.innerHTML = '<li class="vazio">Nenhum nome encontrado.</li>';
        return;
      }
      for (const pessoa of json.dados) {
        const item = document.createElement('li');
        item.textContent = pessoa.nome;
        lista.appendChild(item);
      }
    }

    formLogin.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      erroLogin.textContent = '';
      botaoEntrar.disabled = true;

      try {
        const resposta = await chamar('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value
          })
        });

        const json = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
          erroLogin.textContent = json.erro || `Erro ${resposta.status}`;
          return;
        }

        document.getElementById('senha').value = '';
        mostrarApp(json.usuario);
      } catch (falha) {
        erroLogin.textContent = 'Não foi possível falar com o servidor: ' + falha.message;
      } finally {
        botaoEntrar.disabled = false;
      }
    });

    document.getElementById('sair').addEventListener('click', async () => {
      await chamar('/api/logout', { method: 'POST' }).catch(() => {});
      mostrarLogin();
    });

    campo.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(buscar, 250);
    });

    // Ao abrir a página o JS não consegue ler o cookie (ele é HttpOnly).
    // A única forma de saber se há sessão é perguntar ao servidor.
    (async function iniciar() {
      try {
        const resposta = await chamar('/api/eu');
        if (resposta.ok) {
          const json = await resposta.json();
          mostrarApp(json.usuario);
          return;
        }
      } catch { /* servidor fora do ar: cai no login */ }
      mostrarLogin();
    })();
  </script>
</body>
</html>
