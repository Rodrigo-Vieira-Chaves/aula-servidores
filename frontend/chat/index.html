<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat da aula</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 6h22a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H13l-6 5v-5H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z' fill='%230e8a7e'/%3E%3C/svg%3E">
<style>
:root {
	--bg: #f4f5f7;
	--surface: #ffffff;
	--surface-2: #eef0f3;
	--text: #1a1e23;
	--muted: #5c6571;
	--border: #d8dde3;
	--accent: #0e8a7e;
	--minha: #dcf3ef;
	--http: #e0782a;
	--ok: #15803d;
	--alerta: #b45309;
	--erro: #c62828;
	--sombra: 0 1px 2px rgb(0 0 0 / 0.05), 0 4px 14px rgb(0 0 0 / 0.04);
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #101317;
		--surface: #181c22;
		--surface-2: #222830;
		--text: #e6e9ed;
		--muted: #9aa3ae;
		--border: #2e353f;
		--accent: #2fc2b1;
		--minha: #133a36;
		--http: #f0954f;
		--ok: #4ac27a;
		--alerta: #f0b46b;
		--erro: #ff6b6b;
		--sombra: 0 1px 2px rgb(0 0 0 / 0.4);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #101317;
	--surface: #181c22;
	--surface-2: #222830;
	--text: #e6e9ed;
	--muted: #9aa3ae;
	--border: #2e353f;
	--accent: #2fc2b1;
	--minha: #133a36;
	--http: #f0954f;
	--ok: #4ac27a;
	--alerta: #f0b46b;
	--erro: #ff6b6b;
	--sombra: 0 1px 2px rgb(0 0 0 / 0.4);
	color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0; background: var(--bg); color: var(--text);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
	line-height: 1.45; -webkit-font-smoothing: antialiased;
	display: flex; flex-direction: column;
}
button, input { font: inherit; color: inherit; }

.topo {
	display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
	padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.marca { font-weight: 700; font-size: 1.05rem; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--muted); padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; }
.status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.aberta { color: var(--ok); border-color: var(--ok); }
.status.aberta::before { background: var(--ok); }
.status.caiu { color: var(--alerta); border-color: var(--alerta); }
.status.caiu::before { background: var(--alerta); }
.online { font-size: 0.85rem; color: var(--muted); }
.link-aula { margin-left: auto; font-size: 0.88rem; color: var(--accent); text-decoration: none; font-weight: 600; }

.mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 860px; width: 100%; margin: 0 auto; }
.msg { max-width: min(80%, 560px); background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 12px 4px; padding: 7px 12px; box-shadow: var(--sombra); align-self: flex-start; }
.msg.minha { align-self: flex-end; background: var(--minha); border-radius: 12px 12px 4px 12px; }
.msg .cab { display: flex; gap: 8px; align-items: baseline; font-size: 0.78rem; color: var(--muted); }
.msg .autor { font-weight: 700; color: var(--accent); }
.msg .texto { white-space: pre-wrap; overflow-wrap: anywhere; }
.via { font-size: 0.68rem; font-weight: 700; color: var(--http); border: 1px solid var(--http); border-radius: 999px; padding: 0 6px; }
.aviso { align-self: center; font-size: 0.8rem; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 3px 12px; }
.aviso.erro { color: var(--erro); }

.envio { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 16px; }
.envio form { display: flex; gap: 8px; max-width: 860px; margin: 0 auto; flex-wrap: wrap; }
.envio input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); min-width: 0; }
#nome { flex: 0 1 160px; }
#texto { flex: 1 1 240px; }
.botao { border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; background: var(--accent); color: #fff; font-weight: 700; }
.botao:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header class="topo">
	<span class="marca">💬 Chat da aula</span>
	<span id="status" class="status">conectando…</span>
	<span id="online" class="online"></span>
	<a class="link-aula" href="/#/chat">← a aula</a>
</header>
<main id="mensagens" class="mensagens" aria-live="polite"></main>
<footer class="envio">
	<form id="form">
		<input id="nome" placeholder="seu nome" maxlength="24" autocomplete="off" required>
		<input id="texto" placeholder="escreva uma mensagem" maxlength="500" autocomplete="off" required>
		<button class="botao" id="enviar">Enviar</button>
	</form>
</footer>

<script>
'use strict';

const lista = document.getElementById('mensagens');
const status = document.getElementById('status');
const online = document.getElementById('online');
const nome = document.getElementById('nome');
const texto = document.getElementById('texto');
const botao = document.getElementById('enviar');
let ws = null;

try {
	nome.value = localStorage.getItem('nome') || '';
	const tema = localStorage.getItem('tema');
	if (tema) document.documentElement.dataset.theme = tema;
} catch {}

function el(tag, classe, conteudo) {
	const no = document.createElement(tag);
	if (classe) no.className = classe;
	if (conteudo != null) no.textContent = conteudo;
	return no;
}

function pertoDoFim() {
	return lista.scrollHeight - lista.scrollTop - lista.clientHeight < 80;
}

function rolarSe(estavaNoFim) {
	if (estavaNoFim) lista.scrollTop = lista.scrollHeight;
}

function aviso(textoAviso, classe) {
	const noFim = pertoDoFim();
	lista.append(el('div', `aviso ${classe || ''}`, textoAviso));
	rolarSe(noFim);
}

function bolha(m) {
	const no = el('article', m.autor === nome.value.trim() ? 'msg minha' : 'msg');
	const cab = el('div', 'cab');
	cab.append(el('span', 'autor', m.autor), el('span', null, new Date(m.enviadaEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })));
	if (m.via === 'http') cab.append(el('span', 'via', 'via HTTP'));
	no.append(cab, el('div', 'texto', m.texto));
	return no;
}

function mostrar(m) {
	const noFim = pertoDoFim();
	lista.append(bolha(m));
	while (lista.children.length > 300) lista.firstChild.remove();
	rolarSe(noFim);
}

function estado(classe, rotulo) {
	status.className = `status ${classe}`;
	status.textContent = rotulo;
	botao.disabled = classe !== 'aberta';
}

function conectar() {
	const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/chat`;
	ws = new WebSocket(url);
	estado('', 'conectando…');

	ws.addEventListener('open', () => estado('aberta', 'conectado'));

	ws.addEventListener('message', (e) => {
		const { event, data } = JSON.parse(e.data);
		if (event === 'historico') {
			// Ao (re)conectar, o servidor manda o historico inteiro: a tela e redesenhada a partir dele.
			lista.replaceChildren();
			if (!data.length) aviso('nenhuma mensagem ainda: mande a primeira!');
			data.forEach(mostrar);
			lista.scrollTop = lista.scrollHeight;
		} else if (event === 'mensagem') {
			lista.querySelector('.aviso:only-child')?.remove();
			mostrar(data);
		} else if (event === 'presenca') {
			online.textContent = `${data.online} online`;
		} else if (event === 'exception') {
			aviso(data.message, 'erro');
		}
	});

	// O WebSocket nao reconecta sozinho: quem tenta de novo e a pagina.
	ws.addEventListener('close', (e) => {
		estado('caiu', `caiu (código ${e.code}), reconectando…`);
		online.textContent = '';
		setTimeout(conectar, 2000);
	});
}

document.getElementById('form').addEventListener('submit', (ev) => {
	ev.preventDefault();
	if (ws?.readyState !== WebSocket.OPEN || !texto.value.trim()) return;
	ws.send(JSON.stringify({ event: 'mensagem', data: { autor: nome.value, texto: texto.value } }));
	texto.value = '';
	texto.focus();
});

nome.addEventListener('change', () => {
	try {
		localStorage.setItem('nome', nome.value.trim());
	} catch {}
});

conectar();
(nome.value ? texto : nome).focus();
</script>
</body>
</html>
