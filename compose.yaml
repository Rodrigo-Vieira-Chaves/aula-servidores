services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-aula}
      NOME_SERVIDOR: ${NOME_SERVIDOR:-}
      ORIGENS_PERMITIDAS: ${ORIGENS_PERMITIDAS:-}
      # Precisa ser IDENTICO nos dois backends: e a chave que assina a sessao.
      JWT_SEGREDO: ${JWT_SEGREDO:-}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      COOKIE_DOMINIO: ${COOKIE_DOMINIO:-}
      USUARIO_DEMO: ${USUARIO_DEMO:-aluno}
      SENHA_DEMO: ${SENHA_DEMO:-aula123}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
