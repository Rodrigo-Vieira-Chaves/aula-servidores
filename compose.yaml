# docker compose up -d --build
#
# Um servico so: o backend serve a aula, o chat, o jogo e os WebSockets, tudo na porta 3000.

# Nome fixo do projeto: o compose reconhece os containers mesmo que o
# repositorio seja clonado numa pasta com outro nome.
name: aula

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "${PORTA:-3000}:3000"
    environment:
      LOG_WS: ${LOG_WS:-true}
      HEARTBEAT_MS: ${HEARTBEAT_MS:-15000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health-check').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
